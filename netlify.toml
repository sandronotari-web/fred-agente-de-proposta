[build]
  command = "npm run build"
  functions = "api"
  publish = ".next/static"

[functions]
  external_node_modules = ["@prisma/client"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/.next/:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[dev]
  command = "npm run dev"
  port = 3000

[context.production]
  environment = { DATABASE_URL = "", ANTHROPIC_API_KEY = "", NEXTAUTH_SECRET = "" }

[context.deploy-preview]
  environment = { DATABASE_URL = "", ANTHROPIC_API_KEY = "", NEXTAUTH_SECRET = "" }
